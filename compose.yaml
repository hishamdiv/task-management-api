name: task-management
services:
  task-management-db:
    image: postgres:15-alpine
    container_name: task-management-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskdb
    volumes:
      - task-management-db-data:/var/lib/postgresql/data
    networks:
      - task-management-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  task-management-api:
    build: ./api
    image: task-api:v1.0.0
    container_name: task-management-api
    environment:
      DB_HOST: task-management-db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: taskdb
      DB_PORT: 5432
    depends_on:
      task-management-db:
        condition: service_healthy
    networks:
      - task-management-network
    # Notice: No 'ports' section here. It remains isolated from the host.

  task-management-nginx:
    image: nginx:alpine
    container_name: task-management-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - task-management-api
    networks:
      - task-management-network

networks:
  task-management-network:
    driver: bridge

volumes:
  task-management-db-data:
    name: task-management-db-data
